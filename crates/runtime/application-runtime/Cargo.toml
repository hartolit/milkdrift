[package]
name = "application-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Frontend-neutral application orchestration for model lifecycle, completion, and chat"
publish = false

[package.metadata.milkdrift]
role = "runtime-application"
hardware-suites = [
    { profile = "cuda", target = "cuda_hardware", feature = "cuda-hardware-tests", runner = "harness-free" },
]

[features]
default = []
cuda = ["candle-backend/cuda"]
cuda-hardware-tests = ["cuda"]

[dependencies]
candle-backend.workspace = true
context-planner.workspace = true
domain-contracts.workspace = true
hf-hub-adapter.workspace = true
hf-tokenizer.workspace = true
host-runtime.workspace = true
inference-runtime.workspace = true
redb-storage.workspace = true
tokenization.workspace = true

[dev-dependencies]
sha2.workspace = true

[[test]]
name = "cuda_hardware"
path = "tests/cuda_hardware.rs"
harness = false
required-features = ["cuda-hardware-tests"]

[lints]
workspace = true
