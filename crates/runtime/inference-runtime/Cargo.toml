[package]
name = "inference-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Exclusive model registry and bounded inference lifecycle engine"
publish = false

[package.metadata.milkdrift]
role = "runtime-foundation"
responsibility = "Exclusively own local model and sequence resources with bounded inference lifecycle"
hardware-suites = [
    { profile = "cuda", target = "cuda_hardware", feature = "cuda-hardware-tests", runner = "harness-free" },
    { profile = "cuda", target = "fault_injection", feature = "cuda", runner = "serial-libtest" },
]

[features]
default = []
cuda = ["candle-backend/cuda"]
cuda-hardware-tests = ["cuda"]

[dependencies]
domain-contracts.workspace = true
host-runtime.workspace = true
sampling.workspace = true

[dev-dependencies]
candle-backend.workspace = true
candle-core.workspace = true

[[test]]
name = "cuda_hardware"
path = "tests/cuda_hardware.rs"
harness = false
required-features = ["cuda-hardware-tests"]

[lints]
workspace = true
