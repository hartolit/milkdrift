[package]
name = "desktop-slint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Thin Slint frontend for the reusable application runtime"
publish = false
build = "build.rs"

[package.metadata.milkdrift]
role = "application"
responsibility = "Own the native Slint event loop and presentation over application-runtime"

[features]
default = []
cuda = ["application-runtime/cuda"]

[dependencies]
application-runtime.workspace = true
slint.workspace = true

[build-dependencies]
slint-build.workspace = true

[lints]
workspace = true
