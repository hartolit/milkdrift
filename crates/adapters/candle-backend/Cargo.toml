[package]
name = "candle-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CPU and feature-gated CUDA Llama inference adapter implemented with Hugging Face Candle"
publish = false

[package.metadata.milkdrift]
role = "adapter"
cuda-provider = true

[features]
default = []
benchmark-observation = []
cuda = [
    "dep:cudarc",
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
]
cuda-hardware-tests = ["cuda"]

[dependencies]
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true
cudarc = { workspace = true, optional = true }
domain-contracts.workspace = true
safetensors.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[[test]]
name = "cuda_hardware"
path = "tests/cuda_hardware.rs"
harness = false
required-features = ["cuda-hardware-tests"]

[lints]
workspace = true
