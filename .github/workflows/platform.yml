name: cross-platform contracts

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Platform to qualify (one runner, at most 60 minutes)"
        type: choice
        required: true
        default: windows-2025
        options: [ubuntu-24.04, windows-2025, macos-15]

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}-${{ inputs.runner }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned commit
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy
      - name: Prepare evidence directory
        shell: bash
        run: mkdir -p target/platform-evidence
      - name: Check formatting
        shell: bash
        run: cargo fmt --all -- --check
      - name: Check complete workspace
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --all-features 2>&1 | tee "target/platform-evidence/check-${RUNNER_OS}.log"
      - name: Check product defaults and platform Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked -p milkdrift-daemon -p milkdrift-cli --bins -- -D warnings 2>&1 | tee "target/platform-evidence/product-clippy-${RUNNER_OS}.log"
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings 2>&1 | tee "target/platform-evidence/clippy-${RUNNER_OS}.log"
      - name: Test pure, domain, protocol, client, and local-process contracts
        shell: bash
        run: |
          set -o pipefail
          cargo test --all-features --no-fail-fast \
            -p milkdrift-authority \
            -p milkdrift-blueprint \
            -p milkdrift-capability \
            -p milkdrift-capability-host \
            -p milkdrift-control-client \
            -p milkdrift-control-protocol \
            -p milkdrift-local-process \
            -p milkdrift-model \
            -p milkdrift-peer-protocol \
            -p milkdrift-prompt-sequence \
            -p milkdrift-workspace \
            2>&1 | tee "target/platform-evidence/tests-${RUNNER_OS}.log"
      - name: Test inherited pipes through daemon shutdown and restart
        shell: bash
        run: |
          set -o pipefail
          cargo build -p milkdrift-local-process --bin milkdrift-process-test-helper
          cargo test -p milkdrift-daemon --test control_plane --all-features \
            process_cleanup::inherited_pipes_settle_drain_cancel_and_retain_without_duplicate_entry \
            -- --exact \
            2>&1 | tee "target/platform-evidence/process-shutdown-${RUNNER_OS}.log"
      - name: Upload platform evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-${{ runner.os }}
          path: target/platform-evidence
          if-no-files-found: error
          retention-days: 14
