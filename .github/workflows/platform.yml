name: cross-platform contracts

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned commit
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Prepare evidence directory
        shell: bash
        run: mkdir -p target/platform-evidence
      - name: Check formatting
        shell: bash
        run: cargo fmt --all -- --check
      - name: Check complete workspace
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --all-features 2>&1 | tee "target/platform-evidence/check-${RUNNER_OS}.log"
      - name: Test pure, domain, protocol, client, and local-process contracts
        shell: bash
        run: |
          set -o pipefail
          cargo test --all-features --no-fail-fast \
            -p milkdrift-authority \
            -p milkdrift-blueprint \
            -p milkdrift-capability \
            -p milkdrift-control-client \
            -p milkdrift-control-protocol \
            -p milkdrift-local-process \
            -p milkdrift-model \
            -p milkdrift-peer-protocol \
            -p milkdrift-prompt-sequence \
            -p milkdrift-workspace \
            2>&1 | tee "target/platform-evidence/tests-${RUNNER_OS}.log"
      - name: Upload platform evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-${{ runner.os }}
          path: target/platform-evidence
          if-no-files-found: error
          retention-days: 14
