name: bounded task and peer stress

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bounded-task-peer-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-task-and-peer-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned commit
        with:
          toolchain: 1.95.0
      - name: Build real daemon and peer process fixture
        run: cargo build --release -p milkdrift-daemon --bin milkdrift-daemon -p milkdrift-local-process --bin milkdrift-process-test-helper
      - name: Exercise current durable task limits, entry and recovery
        run: cargo test --release -p milkdrift-runtime --all-features --test durable_runtime -- --nocapture
      - name: Exercise task receipt capacity, reserved settlement and restart
        run: cargo test --release -p milkdrift-redb-store --all-features --test task_workflows --test application_state -- --nocapture
      - name: Verify peer retention turnover and restart
        run: >-
          cargo test --release
          -p milkdrift-daemon
          --test two_daemon_peer
          peer_execution_retention_longevity_survives_turnover_and_restart
          -- --ignored --exact --nocapture
      - name: Exercise scoped task admission
        run: cargo test --release -p milkdrift-control --all-features --test task_authority -- --nocapture
      # Graph occurrence compaction, structured children and controller longevity were retired
      # with their owners in ADR 0051. These task suites prove finite admission and retained
      # recovery; they do not claim the retired 10,000-occurrence compaction semantics.
