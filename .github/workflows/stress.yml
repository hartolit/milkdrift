name: bounded operational frontier stress

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: bounded-operational-frontier-stress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-bounded-operational-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned commit
        with:
          toolchain: 1.95.0
      - name: Run bounded execution frontier regression
        run: >-
          cargo test --release
          -p milkdrift-runtime
          --test structured_runtime
          lifecycle::historical_execution_frontier_stays_bounded_across_index_limit
          -- --ignored --exact --nocapture
      - name: Run 10,000 ordinary occurrence compaction
        run: >-
          cargo test --release -p milkdrift-runtime --lib
          projection::tests::bounded::ten_thousand_closed_task_occurrences_keep_one_terminal_frontier
          -- --exact --nocapture
      - name: Run 10,000 fork/join ownership cycles
        run: >-
          cargo test --release -p milkdrift-runtime --lib
          projection::tests::bounded::ten_thousand_closed_fork_join_cycles_retire_structured_ownership
          -- --exact --nocapture
      - name: Run 10,000 completed subworkflow/repeat children
        run: >-
          cargo test --release -p milkdrift-runtime --lib
          projection::tests::bounded::ten_thousand_completed_repeat_children_keep_only_import_frontier
          -- --exact --nocapture
      - name: Run 10,000 revision node-id churn cycles
        run: >-
          cargo test --release -p milkdrift-runtime --lib
          projection::tests::bounded::ten_thousand_revision_node_churn_drops_removed_root_summaries
          -- --exact --nocapture
      - name: Run 10,000 unmatched-signal budget attempts
        run: >-
          cargo test --release -p milkdrift-runtime --lib
          projection::tests::bounded::ten_thousand_unmatched_signals_cannot_exceed_the_pending_budget
          -- --exact --nocapture
      - name: Run 10,000 pre-start worker lease releases
        run: >-
          cargo test --release -p milkdrift-runtime --lib
          projection::tests::bounded::ten_thousand_pre_start_releases_retain_no_worker_history
          -- --exact --nocapture
