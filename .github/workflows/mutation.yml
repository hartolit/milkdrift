name: targeted mutation evidence

on:
  push:
    paths:
      - ".github/workflows/mutation.yml"
      - ".cargo/mutants.toml"
      - ".cargo/mutation-classifications.json"
      - "tools/evidence/src/bin/mutation-evidence.rs"
  workflow_dispatch:
  schedule:
    - cron: "13 2 * * 6"

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  mutation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: authority, partition: 0, partitions: 1 }
          - { shard: retention, partition: 0, partitions: 1 }
          - { shard: runtime, partition: 0, partitions: 1 }
          - { shard: uncertainty, partition: 0, partitions: 1 }
          - { shard: controller, partition: 0, partitions: 1 }
          - { shard: context, partition: 0, partitions: 1 }
          - { shard: peer, partition: 0, partitions: 4 }
          - { shard: peer, partition: 1, partitions: 4 }
          - { shard: peer, partition: 2, partitions: 4 }
          - { shard: peer, partition: 3, partitions: 4 }
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned commit
        with:
          toolchain: 1.95.0
      - name: Install pinned cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Run focused mutation shard
        env:
          CARGO_MUTANTS_JOBS: ${{ matrix.shard == 'peer' && '1' || '2' }}
          CARGO_MUTANTS_BUILD_TIMEOUT: "600"
          CARGO_MUTANTS_MINIMUM_TEST_TIMEOUT: "600"
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo mutation-evidence "${{ matrix.shard }}" --partition "${{ matrix.partition }}/${{ matrix.partitions }}"
      - name: Upload mutation outcomes and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-${{ matrix.shard }}-${{ matrix.partition }}
          path: target/mutation/${{ matrix.shard }}/mutants.out
          if-no-files-found: error
          retention-days: 14
