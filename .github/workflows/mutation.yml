name: targeted mutation evidence

on:
  workflow_dispatch:
    inputs:
      shard:
        description: "Semantic area to test (one job, at most 60 minutes)"
        type: choice
        required: true
        default: authority
        options: [authority, retention, runtime, uncertainty, controller, context, peer]
      partition:
        description: "Zero-based partition, e.g. 0/4; all partitions are needed for full coverage"
        type: string
        required: true
        default: "0/4"

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned commit
        with:
          toolchain: 1.95.0
      - name: Install pinned cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Run focused mutation shard
        env:
          MUTATION_SHARD: ${{ inputs.shard }}
          MUTATION_PARTITION: ${{ inputs.partition }}
          CARGO_MUTANTS_JOBS: "1"
          CARGO_MUTANTS_BUILD_TIMEOUT: "600"
          CARGO_MUTANTS_MINIMUM_TEST_TIMEOUT: "600"
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo mutation-evidence "$MUTATION_SHARD" --partition "$MUTATION_PARTITION"
      - name: Upload mutation outcomes and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-${{ inputs.shard }}-${{ github.run_id }}
          path: target/mutation/${{ inputs.shard }}/mutants.out
          if-no-files-found: error
          retention-days: 14
