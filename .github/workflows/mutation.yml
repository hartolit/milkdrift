name: targeted mutation evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "13 2 * * 6"

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    strategy:
      fail-fast: false
      matrix:
        shard: [authority, retention, runtime, uncertainty, controller, context, peer]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned commit
        with:
          toolchain: 1.95.0
      - name: Install pinned cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Run focused mutation shard
        env:
          CARGO_MUTANTS_JOBS: "2"
        run: cargo mutation-evidence "${{ matrix.shard }}"
      - name: Upload mutation outcomes and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-${{ matrix.shard }}
          path: target/mutation/${{ matrix.shard }}/mutants.out
          if-no-files-found: error
          retention-days: 14
