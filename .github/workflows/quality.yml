name: quality

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Rust and architecture
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ runner.temp }}/milkdrift-native-quality-target
      MILKDRIFT_SHIM_DIR: ${{ runner.temp }}/milkdrift-forbidden-tool-shims
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preflight native target and disk
        run: |
          set -eu
          test ! -e "${GITHUB_WORKSPACE}/target"

          available_kib="$(df -Pk "${RUNNER_TEMP}" | awk 'NR == 2 { print $4 }')"
          minimum_kib=14680064
          if test "${available_kib}" -lt "${minimum_kib}"
          then
            printf '%s\n' "native quality requires at least 14 GiB free in RUNNER_TEMP" >&2
            df -h "${RUNNER_TEMP}" >&2
            exit 1
          fi

          rm -rf "${CARGO_TARGET_DIR}" "${MILKDRIFT_SHIM_DIR}"
          mkdir -p "${CARGO_TARGET_DIR}" "${MILKDRIFT_SHIM_DIR}"
          df -h "${RUNNER_TEMP}"

      - name: Install selected native compiler and Slint dependencies
        run: |
          sudo apt-get update
          # The selected non-FIPS aws-lc path uses its CC builder; build-essential supplies the native compiler.
          # The remaining development libraries are Slint windowing/font integration packages.
          sudo apt-get install --yes build-essential libfontconfig1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Verify committed lockfile
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Run canonical gate with forbidden-tool shims
        env:
          AWS_LC_SYS_CMAKE_BUILDER: "0"
          AWS_LC_SYS_USE_SYSTEM: "0"
        run: |
          set -eu

          cat > "${MILKDRIFT_SHIM_DIR}/fail" <<'EOF'
          #!/bin/sh
          printf '%s\n' "unexpected external tool invocation: $0" >&2
          exit 86
          EOF
          chmod 755 "${MILKDRIFT_SHIM_DIR}/fail"

          for tool in cmake cmake3 clang clang++ python python3 python-config python3-config pip pip3 pipx uv conda poetry pytest maturin hf huggingface-cli
          do
            ln -s fail "${MILKDRIFT_SHIM_DIR}/${tool}"
          done

          export CMAKE="${MILKDRIFT_SHIM_DIR}/cmake"
          export PYTHON="${MILKDRIFT_SHIM_DIR}/python"
          export PYTHON3="${MILKDRIFT_SHIM_DIR}/python3"
          export PATH="${MILKDRIFT_SHIM_DIR}:${PATH}"

          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          cargo xtask verify

      - name: Report duplicate dependencies
        run: cargo tree -d --locked

      - name: Observe native target and disk
        run: |
          set -eu
          du -sh "${CARGO_TARGET_DIR}"
          df -h "${RUNNER_TEMP}"
          test ! -e "${GITHUB_WORKSPACE}/target"

      - name: Remove native target and shims
        if: ${{ always() }}
        run: |
          set -u
          leaked=0
          if test -e "${GITHUB_WORKSPACE}/target"
          then
            printf '%s\n' "unexpected root target was created" >&2
            du -sh "${GITHUB_WORKSPACE}/target" >&2 || true
            leaked=1
          fi
          if test -e "${CARGO_TARGET_DIR}"
          then
            du -sh "${CARGO_TARGET_DIR}" || true
          fi
          df -h "${RUNNER_TEMP}" || true
          rm -rf "${CARGO_TARGET_DIR}" "${MILKDRIFT_SHIM_DIR}" "${GITHUB_WORKSPACE}/target"
          exit "${leaked}"

  portable:
    name: Portable domain crates (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: WebAssembly
            target: wasm32-unknown-unknown
            target_dir_name: milkdrift-wasm-target
          - name: embedded no_std
            target: thumbv7em-none-eabihf
            target_dir_name: milkdrift-thumb-target
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ runner.temp }}/${{ matrix.target_dir_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preflight portable target and disk
        run: |
          set -eu
          test ! -e "${GITHUB_WORKSPACE}/target"

          available_kib="$(df -Pk "${RUNNER_TEMP}" | awk 'NR == 2 { print $4 }')"
          minimum_kib=4194304
          if test "${available_kib}" -lt "${minimum_kib}"
          then
            printf '%s\n' "portable checks require at least 4 GiB free in RUNNER_TEMP" >&2
            df -h "${RUNNER_TEMP}" >&2
            exit 1
          fi

          rm -rf "${CARGO_TARGET_DIR}"
          mkdir -p "${CARGO_TARGET_DIR}"
          df -h "${RUNNER_TEMP}"

      - name: Install exact portable target
        run: rustup target add "${{ matrix.target }}"

      - name: Check portable domain crates
        run: |
          cargo check --locked \
            --target "${{ matrix.target }}" \
            --lib \
            -p domain-contracts \
            -p tokenization \
            -p context-planner \
            -p sampling \
            -p task-graph

      - name: Observe portable target and disk
        run: |
          set -eu
          du -sh "${CARGO_TARGET_DIR}"
          df -h "${RUNNER_TEMP}"
          test ! -e "${GITHUB_WORKSPACE}/target"

      - name: Remove portable target
        if: ${{ always() }}
        run: |
          set -u
          leaked=0
          if test -e "${GITHUB_WORKSPACE}/target"
          then
            printf '%s\n' "unexpected root target was created" >&2
            du -sh "${GITHUB_WORKSPACE}/target" >&2 || true
            leaked=1
          fi
          if test -e "${CARGO_TARGET_DIR}"
          then
            du -sh "${CARGO_TARGET_DIR}" || true
          fi
          df -h "${RUNNER_TEMP}" || true
          rm -rf "${CARGO_TARGET_DIR}" "${GITHUB_WORKSPACE}/target"
          exit "${leaked}"

  nursery:
    name: Scheduled Clippy nursery
    if: github.event_name == 'schedule'
    continue-on-error: true
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ runner.temp }}/milkdrift-nursery-target
      AWS_LC_SYS_CMAKE_BUILDER: "0"
      AWS_LC_SYS_USE_SYSTEM: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preflight nursery target and disk
        run: |
          set -eu
          test ! -e "${GITHUB_WORKSPACE}/target"
          available_kib="$(df -Pk "${RUNNER_TEMP}" | awk 'NR == 2 { print $4 }')"
          minimum_kib=12582912
          if test "${available_kib}" -lt "${minimum_kib}"
          then
            printf '%s\n' "scheduled nursery requires at least 12 GiB free in RUNNER_TEMP" >&2
            df -h "${RUNNER_TEMP}" >&2
            exit 1
          fi
          rm -rf "${CARGO_TARGET_DIR}"
          mkdir -p "${CARGO_TARGET_DIR}"
          df -h "${RUNNER_TEMP}"

      - name: Install selected native compiler and Slint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libfontconfig1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Report exploratory Clippy nursery findings
        run: cargo clippy --workspace --all-targets --locked -- -W clippy::nursery

      - name: Remove nursery target
        if: ${{ always() }}
        run: |
          set -u
          leaked=0
          if test -e "${GITHUB_WORKSPACE}/target"
          then
            printf '%s\n' "unexpected root target was created" >&2
            du -sh "${GITHUB_WORKSPACE}/target" >&2 || true
            leaked=1
          fi
          if test -e "${CARGO_TARGET_DIR}"
          then
            du -sh "${CARGO_TARGET_DIR}" || true
          fi
          df -h "${RUNNER_TEMP}" || true
          rm -rf "${CARGO_TARGET_DIR}" "${GITHUB_WORKSPACE}/target"
          exit "${leaked}"

  policy:
    name: Dependency and documentation policy
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_INSTALL_ROOT: ${{ runner.temp }}/milkdrift-policy-tools
      CARGO_TARGET_DIR: ${{ runner.temp }}/milkdrift-policy-target
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preflight policy target and disk
        run: |
          set -eu
          test ! -e "${GITHUB_WORKSPACE}/target"
          available_kib="$(df -Pk "${RUNNER_TEMP}" | awk 'NR == 2 { print $4 }')"
          minimum_kib=6291456
          if test "${available_kib}" -lt "${minimum_kib}"
          then
            printf '%s\n' "policy tooling requires at least 6 GiB free in RUNNER_TEMP" >&2
            df -h "${RUNNER_TEMP}" >&2
            exit 1
          fi
          rm -rf "${CARGO_TARGET_DIR}" "${CARGO_INSTALL_ROOT}"
          mkdir -p "${CARGO_TARGET_DIR}" "${CARGO_INSTALL_ROOT}"
          printf '%s\n' "${CARGO_INSTALL_ROOT}/bin" >> "${GITHUB_PATH}"
          df -h "${RUNNER_TEMP}"

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked --root "${CARGO_INSTALL_ROOT}"

      - name: Remove cargo-deny build artifacts
        run: |
          set -eu
          du -sh "${CARGO_TARGET_DIR}"
          rm -rf "${CARGO_TARGET_DIR}"
          mkdir -p "${CARGO_TARGET_DIR}"
          df -h "${RUNNER_TEMP}"

      - name: Install pinned Lychee
        run: cargo install lychee --version 0.24.2 --locked --root "${CARGO_INSTALL_ROOT}"

      - name: Check advisories, licenses, sources, and dependency bans
        run: cargo deny --workspace --locked check advisories bans licenses sources

      - name: Check repository-local Markdown links
        run: lychee --config lychee.toml --offline '**/*.md'

      - name: Remove policy targets and tools
        if: ${{ always() }}
        run: |
          set -u
          leaked=0
          if test -e "${GITHUB_WORKSPACE}/target"
          then
            printf '%s\n' "unexpected root target was created" >&2
            du -sh "${GITHUB_WORKSPACE}/target" >&2 || true
            leaked=1
          fi
          if test -e "${CARGO_TARGET_DIR}"
          then
            du -sh "${CARGO_TARGET_DIR}" || true
          fi
          df -h "${RUNNER_TEMP}" || true
          rm -rf "${CARGO_TARGET_DIR}" "${CARGO_INSTALL_ROOT}" "${GITHUB_WORKSPACE}/target"
          exit "${leaked}"

  external-links:
    name: External Markdown links
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_INSTALL_ROOT: ${{ runner.temp }}/milkdrift-link-tools
      CARGO_TARGET_DIR: ${{ runner.temp }}/milkdrift-external-links-target
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preflight link target and disk
        run: |
          set -eu
          test ! -e "${GITHUB_WORKSPACE}/target"
          available_kib="$(df -Pk "${RUNNER_TEMP}" | awk 'NR == 2 { print $4 }')"
          minimum_kib=4194304
          if test "${available_kib}" -lt "${minimum_kib}"
          then
            printf '%s\n' "external link tooling requires at least 4 GiB free in RUNNER_TEMP" >&2
            df -h "${RUNNER_TEMP}" >&2
            exit 1
          fi
          rm -rf "${CARGO_TARGET_DIR}" "${CARGO_INSTALL_ROOT}"
          mkdir -p "${CARGO_TARGET_DIR}" "${CARGO_INSTALL_ROOT}"
          printf '%s\n' "${CARGO_INSTALL_ROOT}/bin" >> "${GITHUB_PATH}"
          df -h "${RUNNER_TEMP}"

      - name: Install pinned link checker
        run: cargo install lychee --version 0.24.2 --locked --root "${CARGO_INSTALL_ROOT}"

      - name: Check external Markdown links
        run: lychee --config lychee.toml '**/*.md'

      - name: Remove link target and tools
        if: ${{ always() }}
        run: |
          set -u
          leaked=0
          if test -e "${GITHUB_WORKSPACE}/target"
          then
            printf '%s\n' "unexpected root target was created" >&2
            du -sh "${GITHUB_WORKSPACE}/target" >&2 || true
            leaked=1
          fi
          if test -e "${CARGO_TARGET_DIR}"
          then
            du -sh "${CARGO_TARGET_DIR}" || true
          fi
          df -h "${RUNNER_TEMP}" || true
          rm -rf "${CARGO_TARGET_DIR}" "${CARGO_INSTALL_ROOT}" "${GITHUB_WORKSPACE}/target"
          exit "${leaked}"
