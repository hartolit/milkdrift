name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned commit
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt,rust-docs
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features --no-fail-fast
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps
      - run: cargo deny check
      - run: cargo machete
