name: quality

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"

jobs:
  native-components:
    name: Native ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: structure, format, and metadata
            component: structure
            target_name: milkdrift-native-structure-target
            shim_name: milkdrift-native-structure-shims
            minimum_free_kib: 1048576
            system_packages: ""
            use_shims: false
          - name: workspace check
            component: check
            target_name: milkdrift-native-check-target
            shim_name: milkdrift-native-check-shims
            minimum_free_kib: 4194304
            system_packages: build-essential libfontconfig1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
            use_shims: true
          - name: workspace tests
            component: test
            target_name: milkdrift-native-test-target
            shim_name: milkdrift-native-test-shims
            minimum_free_kib: 9437184
            system_packages: build-essential libfontconfig1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
            use_shims: true
          - name: strict Clippy
            component: clippy
            target_name: milkdrift-native-clippy-target
            shim_name: milkdrift-native-clippy-shims
            minimum_free_kib: 4194304
            system_packages: build-essential libfontconfig1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
            use_shims: true
          - name: warning-denied rustdoc
            component: docs
            target_name: milkdrift-native-docs-target
            shim_name: milkdrift-native-docs-shims
            minimum_free_kib: 4194304
            system_packages: build-essential libfontconfig1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
            use_shims: true
          - name: maintained benchmark compilation
            component: benches
            target_name: milkdrift-native-benches-target
            shim_name: milkdrift-native-benches-shims
            minimum_free_kib: 3145728
            system_packages: build-essential
            use_shims: true
    env:
      AWS_LC_SYS_CMAKE_BUILDER: "0"
      AWS_LC_SYS_USE_SYSTEM: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare isolated component target
        env:
          TARGET_NAME: ${{ matrix.target_name }}
          SHIM_NAME: ${{ matrix.shim_name }}
          MINIMUM_FREE_KIB: ${{ matrix.minimum_free_kib }}
        run: |
          set -eu
          cargo_target_dir="${RUNNER_TEMP}/${TARGET_NAME}"
          shim_dir="${RUNNER_TEMP}/${SHIM_NAME}"
          printf 'CARGO_TARGET_DIR=%s\n' "${cargo_target_dir}" >> "${GITHUB_ENV}"
          printf 'MILKDRIFT_SHIM_DIR=%s\n' "${shim_dir}" >> "${GITHUB_ENV}"
          .github/scripts/ci-resource.sh prepare "${MINIMUM_FREE_KIB}" "${cargo_target_dir}"

      - name: Install component system dependencies
        if: matrix.system_packages != ''
        env:
          SYSTEM_PACKAGES: ${{ matrix.system_packages }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes ${SYSTEM_PACKAGES}

      - name: Install forbidden-tool shims
        if: matrix.use_shims
        run: .github/scripts/ci-resource.sh forbidden-shims "${MILKDRIFT_SHIM_DIR}"

      - name: Record checked-out provenance
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'

      - name: Run metadata-owned native component
        run: cargo xtask verify-component "${{ matrix.component }}"

      - name: Report duplicate dependencies
        if: matrix.component == 'structure'
        run: cargo tree -d --locked

      - name: Observe and remove component resources
        if: ${{ always() }}
        env:
          TARGET_NAME: ${{ matrix.target_name }}
          SHIM_NAME: ${{ matrix.shim_name }}
        run: |
          cargo_target_dir="${CARGO_TARGET_DIR:-${RUNNER_TEMP}/${TARGET_NAME}}"
          shim_dir="${MILKDRIFT_SHIM_DIR:-${RUNNER_TEMP}/${SHIM_NAME}}"
          .github/scripts/ci-resource.sh cleanup "${cargo_target_dir}" "${shim_dir}"

  portable:
    name: Portable domain crates (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: WebAssembly
            target: wasm32-unknown-unknown
            target_name: milkdrift-portable-wasm-target
          - name: embedded no_std
            target: thumbv7em-none-eabihf
            target_name: milkdrift-portable-thumb-target
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare isolated portable target
        env:
          TARGET_NAME: ${{ matrix.target_name }}
        run: |
          set -eu
          cargo_target_dir="${RUNNER_TEMP}/${TARGET_NAME}"
          printf 'CARGO_TARGET_DIR=%s\n' "${cargo_target_dir}" >> "${GITHUB_ENV}"
          .github/scripts/ci-resource.sh prepare 1048576 "${cargo_target_dir}"

      - name: Install exact portable target
        run: rustup target add "${{ matrix.target }}"

      - name: Check portable domain crates
        run: cargo xtask portable "${{ matrix.target }}"

      - name: Observe and remove portable target
        if: ${{ always() }}
        env:
          TARGET_NAME: ${{ matrix.target_name }}
        run: |
          cargo_target_dir="${CARGO_TARGET_DIR:-${RUNNER_TEMP}/${TARGET_NAME}}"
          .github/scripts/ci-resource.sh cleanup "${cargo_target_dir}"

  policy:
    name: Dependency and documentation policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare isolated policy tools
        run: |
          set -eu
          cargo_install_root="${RUNNER_TEMP}/milkdrift-policy-tools"
          cargo_target_dir="${RUNNER_TEMP}/milkdrift-policy-target"
          printf 'CARGO_INSTALL_ROOT=%s\n' "${cargo_install_root}" >> "${GITHUB_ENV}"
          printf 'CARGO_TARGET_DIR=%s\n' "${cargo_target_dir}" >> "${GITHUB_ENV}"
          printf '%s\n' "${cargo_install_root}/bin" >> "${GITHUB_PATH}"
          .github/scripts/ci-resource.sh prepare 2097152 \
            "${cargo_target_dir}" "${cargo_install_root}"

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked --root "${CARGO_INSTALL_ROOT}"

      - name: Reset policy build target between tools
        run: .github/scripts/ci-resource.sh reset "${CARGO_TARGET_DIR}"

      - name: Install pinned Lychee
        run: cargo install lychee --version 0.24.2 --locked --root "${CARGO_INSTALL_ROOT}"

      - name: Check advisories, licenses, sources, and dependency bans
        run: cargo deny --workspace --locked check advisories bans licenses sources

      - name: Check repository-local Markdown links
        run: lychee --config lychee.toml --offline '**/*.md'

      - name: Observe and remove policy resources
        if: ${{ always() }}
        run: |
          cargo_target_dir="${CARGO_TARGET_DIR:-${RUNNER_TEMP}/milkdrift-policy-target}"
          cargo_install_root="${CARGO_INSTALL_ROOT:-${RUNNER_TEMP}/milkdrift-policy-tools}"
          .github/scripts/ci-resource.sh cleanup "${cargo_target_dir}" "${cargo_install_root}"

  nursery:
    name: Scheduled Clippy nursery
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    env:
      AWS_LC_SYS_CMAKE_BUILDER: "0"
      AWS_LC_SYS_USE_SYSTEM: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare isolated nursery target
        run: |
          set -eu
          cargo_target_dir="${RUNNER_TEMP}/milkdrift-nursery-target"
          shim_dir="${RUNNER_TEMP}/milkdrift-nursery-shims"
          printf 'CARGO_TARGET_DIR=%s\n' "${cargo_target_dir}" >> "${GITHUB_ENV}"
          printf 'MILKDRIFT_SHIM_DIR=%s\n' "${shim_dir}" >> "${GITHUB_ENV}"
          .github/scripts/ci-resource.sh prepare 4194304 "${cargo_target_dir}"

      - name: Install native compiler and Slint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libfontconfig1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Install forbidden-tool shims
        run: .github/scripts/ci-resource.sh forbidden-shims "${MILKDRIFT_SHIM_DIR}"

      - name: Report exploratory Clippy nursery findings
        continue-on-error: true
        run: cargo xtask verify-component nursery

      - name: Observe and remove nursery resources
        if: ${{ always() }}
        run: |
          cargo_target_dir="${CARGO_TARGET_DIR:-${RUNNER_TEMP}/milkdrift-nursery-target}"
          shim_dir="${MILKDRIFT_SHIM_DIR:-${RUNNER_TEMP}/milkdrift-nursery-shims}"
          .github/scripts/ci-resource.sh cleanup "${cargo_target_dir}" "${shim_dir}"

  external-links:
    name: External Markdown links
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare isolated link checker
        run: |
          set -eu
          cargo_install_root="${RUNNER_TEMP}/milkdrift-link-tools"
          cargo_target_dir="${RUNNER_TEMP}/milkdrift-external-links-target"
          printf 'CARGO_INSTALL_ROOT=%s\n' "${cargo_install_root}" >> "${GITHUB_ENV}"
          printf 'CARGO_TARGET_DIR=%s\n' "${cargo_target_dir}" >> "${GITHUB_ENV}"
          printf '%s\n' "${cargo_install_root}/bin" >> "${GITHUB_PATH}"
          .github/scripts/ci-resource.sh prepare 2097152 \
            "${cargo_target_dir}" "${cargo_install_root}"

      - name: Install pinned link checker
        run: cargo install lychee --version 0.24.2 --locked --root "${CARGO_INSTALL_ROOT}"

      - name: Check external Markdown links
        run: lychee --config lychee.toml '**/*.md'

      - name: Observe and remove link-check resources
        if: ${{ always() }}
        run: |
          cargo_target_dir="${CARGO_TARGET_DIR:-${RUNNER_TEMP}/milkdrift-external-links-target}"
          cargo_install_root="${CARGO_INSTALL_ROOT:-${RUNNER_TEMP}/milkdrift-link-tools}"
          .github/scripts/ci-resource.sh cleanup "${cargo_target_dir}" "${cargo_install_root}"
