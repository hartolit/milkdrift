name: CUDA hardware

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .gitignore
      - .cargo/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**
      - benchmarks/runtime/**
      - tools/xtask/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: milkdrift-cuda-hardware
  cancel-in-progress: false

jobs:
  cuda:
    name: RTX 5070 Ti correctness
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.actor == github.repository_owner)
    runs-on:
      - self-hosted
      - Linux
      - X64
      - milkdrift-cuda-5070ti
    timeout-minutes: 90
    env:
      CARGO_HOME: /var/tmp/milkdrift-cargo-home
      CARGO_NET_OFFLINE: "true"
      CUDA_COMPUTE_CAP: "120"
      CUDA_VISIBLE_DEVICES: "0"
      MILKDRIFT_CUDA_TEST: "1"
    steps:
      - name: Check out trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare isolated target
        run: |
          set -eu
          test -d "${CARGO_HOME}/registry/index"
          test -d "${CARGO_HOME}/registry/cache"
          test -d "${CARGO_HOME}/registry/src"
          test -w "${CARGO_HOME}"

          target_dir="${RUNNER_TEMP}/milkdrift-cuda-target"
          rm -rf "${target_dir}"
          mkdir -p "${target_dir}"
          printf 'CARGO_TARGET_DIR=%s\n' "${target_dir}" >> "${GITHUB_ENV}"

      - name: Preflight exact CUDA matrix
        run: |
          set -eu
          nvidia-smi
          nvcc --version
          rustc --version
          cargo --version
          free -h
          df -h "${RUNNER_TEMP}"

          test "${CUDA_VISIBLE_DEVICES}" = "0"
          test "${CUDA_COMPUTE_CAP}" = "120"

          gpu_matrix="$(nvidia-smi --id=0 --query-gpu=index,name,compute_cap --format=csv,noheader,nounits)"
          test "${gpu_matrix}" = "0, NVIDIA GeForce RTX 5070 Ti, 12.0"

          toolkit_release="$(nvcc --version | sed -n 's/.*release \([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p')"
          test -n "${toolkit_release}"
          toolkit_major="${toolkit_release%%.*}"
          toolkit_minor="${toolkit_release#*.}"
          if test "${toolkit_major}" -lt 12 || { test "${toolkit_major}" -eq 12 && test "${toolkit_minor}" -lt 8; }; then
            printf '%s\n' "CUDA Toolkit ${toolkit_release} is older than required 12.8" >&2
            exit 1
          fi

      - name: Validate metadata and architecture policy
        run: |
          set -eu
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          cargo xtask architecture
          cargo xtask hygiene

      - name: Check exact CUDA feature graph
        run: |
          set -eu
          cargo check --locked \
            -p candle-backend \
            -p inference-runtime \
            -p application-runtime \
            -p desktop-slint \
            -p runtime-benchmarks \
            --all-targets \
            --features cuda

      - name: Compile exact CUDA test graph
        run: |
          set -eu
          cargo test --locked \
            -p candle-backend \
            -p inference-runtime \
            -p application-runtime \
            -p runtime-benchmarks \
            --features cuda \
            --no-run

      - name: Clippy exact CUDA feature graph
        run: |
          set -eu
          cargo clippy --locked \
            -p candle-backend \
            -p inference-runtime \
            -p application-runtime \
            -p desktop-slint \
            -p runtime-benchmarks \
            --all-targets \
            --features cuda \
            -- -D warnings

      - name: Prove CPU execution in the CUDA build
        run: |
          set -eu
          test_list="$(cargo test --release --locked \
            -p candle-backend \
            --features cuda \
            --test llama_cuda \
            -- \
            --list)"
          printf '%s\n' "${test_list}" \
            | grep -Fqx 'cuda_enabled_binary_can_explicitly_execute_cpu: test'
          ignored_test_list="$(cargo test --release --locked \
            -p candle-backend \
            --features cuda \
            --test llama_cuda \
            -- \
            --ignored \
            --list)"
          if printf '%s\n' "${ignored_test_list}" \
            | grep -Fqx 'cuda_enabled_binary_can_explicitly_execute_cpu: test'
          then
            echo 'explicit CPU-in-CUDA test must remain non-ignored' >&2
            exit 1
          fi
          cargo test --release --locked \
            -p candle-backend \
            --features cuda \
            --test llama_cuda \
            -- \
            --exact cuda_enabled_binary_can_explicitly_execute_cpu \
            --nocapture \
            --test-threads=1

      - name: Prove homogeneous and mixed CUDA adapter matrix
        run: |
          set -eu
          ignored_test_list="$(cargo test --release --locked \
            -p candle-backend \
            --features cuda \
            --test llama_cuda \
            -- \
            --ignored \
            --list)"
          test "$(printf '%s\n' "${ignored_test_list}" | grep -Fc ': test')" -eq 4
          for test_name in \
            cuda_ordinal_zero_executes_fixture_and_matches_cpu_logits \
            cuda_homogeneous_bf16_source_executes_as_bf16 \
            cuda_mixed_f16_f32_executes_as_f16 \
            cuda_mixed_bf16_f32_executes_as_bf16
          do
            printf '%s\n' "${ignored_test_list}" | grep -Fqx "${test_name}: test"
            cargo test --release --locked \
              -p candle-backend \
              --features cuda \
              --test llama_cuda \
              -- \
              --include-ignored \
              --exact "${test_name}" \
              --nocapture \
              --test-threads=1
          done

      - name: Prove hosted E0 CUDA lifecycle and zero accounting
        run: |
          set -eu
          ignored_test_list="$(cargo test --release --locked \
            -p inference-runtime \
            --features cuda \
            --test native_backend_generation \
            -- \
            --ignored \
            --list)"
          printf '%s\n' "${ignored_test_list}" \
            | grep -Fqx 'candle_mixed_cuda_fixture_covers_e0_generation_accounting_and_lifecycle: test'
          cargo test --release --locked \
            -p inference-runtime \
            --features cuda \
            --test native_backend_generation \
            -- \
            --include-ignored \
            --exact candle_mixed_cuda_fixture_covers_e0_generation_accounting_and_lifecycle \
            --nocapture \
            --test-threads=1

      - name: Prove deterministic failure cleanup and explicit no-fallback policy
        run: |
          set -eu
          cargo test --release --locked \
            -p inference-runtime \
            --features cuda \
            --test fault_injection \
            -- \
            --nocapture \
            --test-threads=1
          test_list="$(cargo test --release --locked \
            -p application-runtime \
            --features cuda \
            --lib \
            -- \
            --list)"
          printf '%s\n' "${test_list}" \
            | grep -Fqx 'runtime::tests::devices::unavailable_selected_cuda_blocks_load_without_fallback: test'
          ignored_test_list="$(cargo test --release --locked \
            -p application-runtime \
            --features cuda \
            --lib \
            -- \
            --ignored \
            --list)"
          if printf '%s\n' "${ignored_test_list}" \
            | grep -Fqx 'runtime::tests::devices::unavailable_selected_cuda_blocks_load_without_fallback: test'
          then
            echo 'explicit no-fallback test must remain non-ignored' >&2
            exit 1
          fi
          cargo test --release --locked \
            -p application-runtime \
            --features cuda \
            --lib \
            -- \
            --exact runtime::tests::devices::unavailable_selected_cuda_blocks_load_without_fallback \
            --nocapture \
            --test-threads=1

      - name: Prove E1 CUDA discovery selection scalar truth and shutdown
        run: |
          set -eu
          ignored_test_list="$(cargo test --release --locked \
            -p application-runtime \
            --features cuda \
            --lib \
            -- \
            --ignored \
            --list)"
          printf '%s\n' "${ignored_test_list}" \
            | grep -Fqx 'runtime::tests::devices::cuda_fixture_load_reports_the_selected_and_actual_e1_device: test'
          cargo test --release --locked \
            -p application-runtime \
            --features cuda \
            --lib \
            -- \
            --include-ignored \
            --exact runtime::tests::devices::cuda_fixture_load_reports_the_selected_and_actual_e1_device \
            --nocapture \
            --test-threads=1

      - name: Remove isolated target
        if: ${{ always() }}
        run: |
          rm -rf "${RUNNER_TEMP}/milkdrift-cuda-target"
