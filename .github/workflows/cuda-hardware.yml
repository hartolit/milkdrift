name: CUDA hardware

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .gitignore
      - .cargo/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**
      - benchmarks/runtime/**
      - tools/xtask/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: milkdrift-cuda-hardware
  cancel-in-progress: false

jobs:
  cuda:
    name: RTX 5070 Ti correctness
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.actor == github.repository_owner)
    runs-on:
      - self-hosted
      - Linux
      - X64
      - milkdrift-cuda-5070ti
    timeout-minutes: 90
    env:
      CARGO_HOME: /var/tmp/milkdrift-cargo-home
      CARGO_INCREMENTAL: "0"
      CARGO_NET_OFFLINE: "true"
      CUDA_CHECK_TARGET_DIR: ${{ runner.temp }}/milkdrift-cuda-check-target
      CUDA_HARDWARE_TARGET_DIR: ${{ runner.temp }}/milkdrift-cuda-hardware-target
      CUDA_COMPUTE_CAP: "120"
      CUDA_VISIBLE_DEVICES: "0"
      MILKDRIFT_CUDA_TEST: "1"
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Preflight storage and isolated CUDA targets
        run: |
          set -eu
          test ! -e "${GITHUB_WORKSPACE}/target"
          test -d "${CARGO_HOME}/registry/index"
          test -d "${CARGO_HOME}/registry/cache"
          test -d "${CARGO_HOME}/registry/src"
          test -w "${CARGO_HOME}"

          runner_available_kib="$(df -Pk "${RUNNER_TEMP}" | awk 'NR == 2 { print $4 }')"
          runner_minimum_kib=20971520
          if test "${runner_available_kib}" -lt "${runner_minimum_kib}"
          then
            printf '%s\n' "CUDA validation requires at least 20 GiB free in RUNNER_TEMP" >&2
            df -h "${RUNNER_TEMP}" >&2
            exit 1
          fi

          cargo_available_kib="$(df -Pk "${CARGO_HOME}" | awk 'NR == 2 { print $4 }')"
          cargo_minimum_kib=4194304
          if test "${cargo_available_kib}" -lt "${cargo_minimum_kib}"
          then
            printf '%s\n' "the maintained CUDA CARGO_HOME requires at least 4 GiB free" >&2
            df -h "${CARGO_HOME}" >&2
            exit 1
          fi

          rm -rf "${CUDA_CHECK_TARGET_DIR}" "${CUDA_HARDWARE_TARGET_DIR}"
          mkdir -p "${CUDA_CHECK_TARGET_DIR}"
          du -sh "${CARGO_HOME}"
          df -h "${RUNNER_TEMP}" "${CARGO_HOME}"

      - name: Preflight exact CUDA matrix
        run: |
          set -eu
          nvidia-smi
          nvcc --version
          rustc --version
          cargo --version
          free -h
          df -h "${RUNNER_TEMP}" "${CARGO_HOME}"

          test "${CUDA_VISIBLE_DEVICES}" = "0"
          test "${CUDA_COMPUTE_CAP}" = "120"

          gpu_matrix="$(nvidia-smi --id=0 --query-gpu=index,name,compute_cap --format=csv,noheader,nounits)"
          test "${gpu_matrix}" = "0, NVIDIA GeForce RTX 5070 Ti, 12.0"

          toolkit_release="$(nvcc --version | sed -n 's/.*release \([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p')"
          test -n "${toolkit_release}"
          toolkit_major="${toolkit_release%%.*}"
          toolkit_minor="${toolkit_release#*.}"
          if test "${toolkit_major}" -lt 12 || { test "${toolkit_major}" -eq 12 && test "${toolkit_minor}" -lt 8; }
          then
            printf '%s\n' "CUDA Toolkit ${toolkit_release} is older than required 12.8" >&2
            exit 1
          fi

      - name: Validate metadata and architecture policy
        run: |
          set -eu
          CARGO_TARGET_DIR="${CUDA_CHECK_TARGET_DIR}" cargo metadata --locked --format-version 1 --no-deps > /dev/null
          CARGO_TARGET_DIR="${CUDA_CHECK_TARGET_DIR}" cargo xtask architecture
          CARGO_TARGET_DIR="${CUDA_CHECK_TARGET_DIR}" cargo xtask hygiene

      - name: Check exact CUDA feature graph
        run: |
          set -eu
          CARGO_TARGET_DIR="${CUDA_CHECK_TARGET_DIR}" cargo check --locked \
            -p candle-backend \
            -p inference-runtime \
            -p application-runtime \
            -p desktop-slint \
            -p runtime-benchmarks \
            --all-targets \
            --features cuda

      - name: Compile exact CUDA test graph
        run: |
          set -eu
          CARGO_TARGET_DIR="${CUDA_CHECK_TARGET_DIR}" cargo test --locked \
            -p candle-backend \
            -p inference-runtime \
            -p application-runtime \
            -p runtime-benchmarks \
            --features cuda \
            --no-run

      - name: Compile dedicated CUDA hardware suites
        run: |
          set -eu
          CARGO_TARGET_DIR="${CUDA_CHECK_TARGET_DIR}" cargo test --locked \
            -p candle-backend \
            --features cuda-hardware-tests \
            --test cuda_hardware \
            --no-run
          CARGO_TARGET_DIR="${CUDA_CHECK_TARGET_DIR}" cargo test --locked \
            -p inference-runtime \
            --features cuda-hardware-tests \
            --test cuda_hardware \
            --no-run
          CARGO_TARGET_DIR="${CUDA_CHECK_TARGET_DIR}" cargo test --locked \
            -p application-runtime \
            --features cuda-hardware-tests \
            --test cuda_hardware \
            --no-run

      - name: Clippy exact CUDA feature graph
        run: |
          set -eu
          CARGO_TARGET_DIR="${CUDA_CHECK_TARGET_DIR}" cargo clippy --locked \
            -p candle-backend \
            -p inference-runtime \
            -p application-runtime \
            -p desktop-slint \
            -p runtime-benchmarks \
            --all-targets \
            --features cuda \
            -- -D warnings
          CARGO_TARGET_DIR="${CUDA_CHECK_TARGET_DIR}" cargo clippy --locked \
            -p candle-backend \
            --features cuda-hardware-tests \
            --test cuda_hardware \
            -- -D warnings
          CARGO_TARGET_DIR="${CUDA_CHECK_TARGET_DIR}" cargo clippy --locked \
            -p inference-runtime \
            --features cuda-hardware-tests \
            --test cuda_hardware \
            -- -D warnings
          CARGO_TARGET_DIR="${CUDA_CHECK_TARGET_DIR}" cargo clippy --locked \
            -p application-runtime \
            --features cuda-hardware-tests \
            --test cuda_hardware \
            -- -D warnings

      - name: Observe and remove CUDA check target
        run: |
          set -eu
          du -sh "${CUDA_CHECK_TARGET_DIR}"
          du -sh "${CARGO_HOME}"
          df -h "${RUNNER_TEMP}" "${CARGO_HOME}"
          test ! -e "${GITHUB_WORKSPACE}/target"
          rm -rf "${CUDA_CHECK_TARGET_DIR}"
          test ! -e "${CUDA_CHECK_TARGET_DIR}"

      - name: Prepare fresh CUDA hardware target
        run: |
          set -eu
          test ! -e "${CUDA_CHECK_TARGET_DIR}"
          test ! -e "${GITHUB_WORKSPACE}/target"
          rm -rf "${CUDA_HARDWARE_TARGET_DIR}"
          mkdir -p "${CUDA_HARDWARE_TARGET_DIR}"
          df -h "${RUNNER_TEMP}" "${CARGO_HOME}"

      - name: Run complete CUDA adapter suite
        run: |
          set -eu
          CARGO_TARGET_DIR="${CUDA_HARDWARE_TARGET_DIR}" cargo test --release --locked \
            -p candle-backend \
            --features cuda-hardware-tests \
            --test cuda_hardware

      - name: Run complete hosted E0 CUDA suite
        run: |
          set -eu
          CARGO_TARGET_DIR="${CUDA_HARDWARE_TARGET_DIR}" cargo test --release --locked \
            -p inference-runtime \
            --features cuda-hardware-tests \
            --test cuda_hardware

      - name: Run deterministic failure cleanup suite
        run: |
          set -eu
          CARGO_TARGET_DIR="${CUDA_HARDWARE_TARGET_DIR}" cargo test --release --locked \
            -p inference-runtime \
            --features cuda \
            --test fault_injection \
            -- \
            --nocapture \
            --test-threads=1

      - name: Run complete E1 CUDA suite
        run: |
          set -eu
          CARGO_TARGET_DIR="${CUDA_HARDWARE_TARGET_DIR}" cargo test --release --locked \
            -p application-runtime \
            --features cuda-hardware-tests \
            --test cuda_hardware

      - name: Observe CUDA hardware target and disk
        run: |
          set -eu
          du -sh "${CUDA_HARDWARE_TARGET_DIR}"
          du -sh "${CARGO_HOME}"
          df -h "${RUNNER_TEMP}" "${CARGO_HOME}"
          test ! -e "${GITHUB_WORKSPACE}/target"

      - name: Remove isolated CUDA targets
        if: ${{ always() }}
        run: |
          set -u
          leaked=0
          if test -e "${GITHUB_WORKSPACE}/target"
          then
            printf '%s\n' "unexpected root target was created" >&2
            du -sh "${GITHUB_WORKSPACE}/target" >&2 || true
            leaked=1
          fi
          if test -e "${CUDA_CHECK_TARGET_DIR}"
          then
            du -sh "${CUDA_CHECK_TARGET_DIR}" || true
          fi
          if test -e "${CUDA_HARDWARE_TARGET_DIR}"
          then
            du -sh "${CUDA_HARDWARE_TARGET_DIR}" || true
          fi
          du -sh "${CARGO_HOME}" || true
          df -h "${RUNNER_TEMP}" "${CARGO_HOME}" || true
          rm -rf "${CUDA_CHECK_TARGET_DIR}" "${CUDA_HARDWARE_TARGET_DIR}" "${GITHUB_WORKSPACE}/target"
          exit "${leaked}"
