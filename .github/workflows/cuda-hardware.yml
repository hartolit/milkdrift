name: CUDA hardware

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .gitignore
      - .cargo/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**
      - benchmarks/runtime/**
      - tools/xtask/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: milkdrift-cuda-hardware
  cancel-in-progress: false

jobs:
  cuda:
    name: RTX 5070 Ti correctness
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.actor == github.repository_owner)
    runs-on:
      - self-hosted
      - Linux
      - X64
      - milkdrift-cuda-5070ti
    timeout-minutes: 90
    env:
      CARGO_HOME: /var/tmp/milkdrift-cargo-home
      CARGO_INCREMENTAL: "0"
      CARGO_NET_OFFLINE: "true"
      CUDA_COMPUTE_CAP: "120"
      CUDA_VISIBLE_DEVICES: "0"
      MILKDRIFT_CUDA_TEST: "1"
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Preflight storage and isolated CUDA targets
        run: |
          set -eu
          cuda_check_target_dir="${RUNNER_TEMP}/milkdrift-cuda-check-target"
          cuda_hardware_target_dir="${RUNNER_TEMP}/milkdrift-cuda-hardware-target"
          printf 'CUDA_CHECK_TARGET_DIR=%s\n' "${cuda_check_target_dir}" >> "${GITHUB_ENV}"
          printf 'CUDA_HARDWARE_TARGET_DIR=%s\n' "${cuda_hardware_target_dir}" >> "${GITHUB_ENV}"
          test ! -e "${GITHUB_WORKSPACE}/target"
          test -d "${CARGO_HOME}/registry/index"
          test -d "${CARGO_HOME}/registry/cache"
          test -d "${CARGO_HOME}/registry/src"
          test -w "${CARGO_HOME}"

          cargo_available_kib="$(df -Pk "${CARGO_HOME}" | awk 'NR == 2 { print $4 }')"
          cargo_minimum_kib=4194304
          if test "${cargo_available_kib}" -lt "${cargo_minimum_kib}"
          then
            printf '%s\n' "the maintained CUDA CARGO_HOME requires at least 4 GiB free" >&2
            df -h "${CARGO_HOME}" >&2
            exit 1
          fi

          .github/scripts/ci-resource.sh prepare 20971520 \
            "${cuda_check_target_dir}" "${cuda_hardware_target_dir}"
          du -sh "${CARGO_HOME}"
          df -h "${RUNNER_TEMP}" "${CARGO_HOME}"

      - name: Preflight exact CUDA matrix
        run: |
          set -eu
          nvidia-smi
          nvcc --version
          rustc --version
          cargo --version
          free -h
          df -h "${RUNNER_TEMP}" "${CARGO_HOME}"

          test "${CUDA_VISIBLE_DEVICES}" = "0"
          test "${CUDA_COMPUTE_CAP}" = "120"

          gpu_matrix="$(nvidia-smi --id=0 --query-gpu=index,name,compute_cap --format=csv,noheader,nounits)"
          test "${gpu_matrix}" = "0, NVIDIA GeForce RTX 5070 Ti, 12.0"

          toolkit_release="$(nvcc --version | sed -n 's/.*release \([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p')"
          test -n "${toolkit_release}"
          toolkit_major="${toolkit_release%%.*}"
          toolkit_minor="${toolkit_release#*.}"
          if test "${toolkit_major}" -lt 12 || { test "${toolkit_major}" -eq 12 && test "${toolkit_minor}" -lt 8; }
          then
            printf '%s\n' "CUDA Toolkit ${toolkit_release} is older than required 12.8" >&2
            exit 1
          fi

      - name: Synchronize locked CUDA dependency cache
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked

      - name: Validate metadata and architecture policy
        run: |
          set -eu
          CARGO_TARGET_DIR="${CUDA_CHECK_TARGET_DIR}" cargo metadata --locked --format-version 1 --no-deps > /dev/null
          CARGO_TARGET_DIR="${CUDA_CHECK_TARGET_DIR}" cargo xtask architecture
          CARGO_TARGET_DIR="${CUDA_CHECK_TARGET_DIR}" cargo xtask hygiene

      - name: Compile metadata-owned CUDA graphs and hardware suites
        run: |
          set -eu
          CARGO_TARGET_DIR="${CUDA_CHECK_TARGET_DIR}" cargo xtask cuda-compile

      - name: Clippy metadata-owned CUDA graphs and hardware suites
        run: |
          set -eu
          CARGO_TARGET_DIR="${CUDA_CHECK_TARGET_DIR}" cargo xtask cuda-clippy

      - name: Observe and remove CUDA check target
        run: |
          set -eu
          du -sh "${CARGO_HOME}"
          df -h "${CARGO_HOME}"
          .github/scripts/ci-resource.sh cleanup "${CUDA_CHECK_TARGET_DIR}"

      - name: Prepare fresh CUDA hardware target
        run: |
          set -eu
          test ! -e "${CUDA_CHECK_TARGET_DIR}"
          .github/scripts/ci-resource.sh prepare 20971520 "${CUDA_HARDWARE_TARGET_DIR}"
          df -h "${RUNNER_TEMP}" "${CARGO_HOME}"

      - name: Run metadata-owned CUDA hardware profile
        run: |
          set -eu
          CARGO_TARGET_DIR="${CUDA_HARDWARE_TARGET_DIR}" cargo xtask hardware cuda

      - name: Observe CUDA hardware target and disk
        run: |
          set -eu
          du -sh "${CUDA_HARDWARE_TARGET_DIR}"
          du -sh "${CARGO_HOME}"
          df -h "${RUNNER_TEMP}" "${CARGO_HOME}"
          test ! -e "${GITHUB_WORKSPACE}/target"

      - name: Remove isolated CUDA targets
        if: ${{ always() }}
        run: |
          cuda_check_target_dir="${CUDA_CHECK_TARGET_DIR:-${RUNNER_TEMP}/milkdrift-cuda-check-target}"
          cuda_hardware_target_dir="${CUDA_HARDWARE_TARGET_DIR:-${RUNNER_TEMP}/milkdrift-cuda-hardware-target}"
          du -sh "${CARGO_HOME}" || true
          df -h "${CARGO_HOME}" || true
          .github/scripts/ci-resource.sh cleanup \
            "${cuda_check_target_dir}" "${cuda_hardware_target_dir}"
