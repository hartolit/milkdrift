[package]
name = "runtime-benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Controlled runtime benchmarks and explicit E1 product baselines"
publish = false

[package.metadata.milkdrift]
role = "benchmark-observer"
responsibility = "Measure the current E0 and E1 lifecycle through public product APIs"
benchmark-targets = ["runtime"]

[features]
default = []
cuda = ["application-runtime/cuda"]

[dependencies]
application-runtime.workspace = true
candle-backend = { workspace = true, features = ["benchmark-observation"] }
domain-contracts.workspace = true
host-runtime.workspace = true
inference-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "runtime"
harness = false

[lints]
workspace = true
