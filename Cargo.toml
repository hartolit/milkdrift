[workspace]
members = [
    "tools/xtask",
    "benchmarks/runtime",
    "crates/domain/domain-contracts",
    "crates/domain/tokenization",
    "crates/domain/context-planner",
    "crates/domain/sampling",
    "crates/domain/task-graph",
    "crates/platform/host-runtime",
    "crates/adapters/candle-backend",
    "crates/adapters/hf-tokenizer",
    "crates/adapters/hf-hub",
    "crates/adapters/redb-storage",
    "crates/runtime/inference-runtime",
    "crates/runtime/corrective-workflow",
    "crates/runtime/application-runtime",
    "crates/apps/desktop-slint",
]

resolver = "3"

[workspace.dependencies]
cargo_metadata = "0.23.1"
application-runtime = { path = "crates/runtime/application-runtime" }
candle-backend = { path = "crates/adapters/candle-backend" }
corrective-workflow = { path = "crates/runtime/corrective-workflow" }
context-planner = { path = "crates/domain/context-planner" }
domain-contracts = { path = "crates/domain/domain-contracts" }
hf-hub-adapter = { path = "crates/adapters/hf-hub" }
hf-tokenizer = { path = "crates/adapters/hf-tokenizer" }
host-runtime = { path = "crates/platform/host-runtime" }
inference-runtime = { path = "crates/runtime/inference-runtime" }
redb-storage = { path = "crates/adapters/redb-storage" }
sampling = { path = "crates/domain/sampling" }
task-graph = { path = "crates/domain/task-graph" }
tokenization = { path = "crates/domain/tokenization" }
libm = { version = "0.2", default-features = false }
candle-core = { version = "0.11.0", default-features = false }
candle-nn = { version = "0.11.0", default-features = false }
candle-transformers = { version = "0.11.0", default-features = false }
cudarc = { version = "=0.19.8", default-features = false, features = ["std", "driver", "cuda-version-from-build-system", "dynamic-linking"] }
serde_json = "1.0"
flume = { version = "0.12.0", default-features = false }
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
hf-hub = { version = "1.0", default-features = false, features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = { version = "0.11.0", default-features = false }
redb = { version = "4.1.0", default-features = false }
slint = { version = "1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2"] }
slint-build = "1.17.1"
stats_alloc = "0.1.10"
criterion = { version = "0.8.2", default-features = false }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
