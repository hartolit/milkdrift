[workspace]
resolver = "3"
members = [
    "adapters/local-process",
    "adapters/managed-linux",
    "adapters/model-provider",
    "adapters/peer-http",
    "adapters/redb-store",
    "adapters/local-secret",
    "crates/authority",
    "crates/blueprint",
    "crates/capability",
    "crates/capability-host",
    "crates/contracts",
    "crates/control",
    "crates/control-client",
    "crates/control-protocol",
    "crates/model",
    "crates/persistence",
    "crates/prompt-sequence",
    "crates/peer-protocol",
    "crates/runtime",
    "crates/workspace",
    "apps/cli",
    "apps/daemon",
    "tools/evidence",
    "examples/adaptive-slotbook",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hartolit/milkdrift"
rust-version = "1.95"

[workspace.dependencies]
base64 = "0.22.1"
blake3 = "1.8.2"
axum = { version = "0.8.9", features = ["json", "tokio", "http1"] }
async-stream = "0.3.6"
clap = { version = "4.6.6", features = ["derive", "env"] }
futures-util = "0.3.31"
milkdrift-authority = { version = "=0.1.0", path = "crates/authority" }
milkdrift-blueprint = { version = "=0.1.0", path = "crates/blueprint" }
milkdrift-capability = { version = "=0.1.0", path = "crates/capability" }
milkdrift-capability-host = { version = "=0.1.0", path = "crates/capability-host" }
milkdrift-contracts = { version = "=0.1.0", path = "crates/contracts" }
milkdrift-control = { version = "=0.1.0", path = "crates/control" }
milkdrift-control-client = { version = "=0.1.0", path = "crates/control-client" }
milkdrift-control-protocol = { version = "=0.1.0", path = "crates/control-protocol" }
milkdrift-daemon = { version = "=0.1.0", path = "apps/daemon" }
milkdrift-managed-linux = { version = "=0.1.0", path = "adapters/managed-linux" }
milkdrift-local-process = { version = "=0.1.0", path = "adapters/local-process" }
milkdrift-local-secret = { version = "=0.1.0", path = "adapters/local-secret" }
milkdrift-model = { version = "=0.1.0", path = "crates/model" }
milkdrift-model-provider = { version = "=0.1.0", path = "adapters/model-provider" }
milkdrift-peer-http = { version = "=0.1.0", path = "adapters/peer-http" }
milkdrift-peer-protocol = { version = "=0.1.0", path = "crates/peer-protocol" }
milkdrift-persistence = { version = "=0.1.0", path = "crates/persistence" }
milkdrift-prompt-sequence = { version = "=0.1.0", path = "crates/prompt-sequence" }
milkdrift-redb-store = { version = "=0.1.0", path = "adapters/redb-store" }
milkdrift-runtime = { version = "=0.1.0", path = "crates/runtime" }
milkdrift-workspace = { version = "=0.1.0", path = "crates/workspace" }
proptest = "1.7.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
subtle = "2.6.1"
tempfile = "3.21.0"
thiserror = "2.0.16"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
toml = "1.1.4"
tower = { version = "0.5.2", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6.6", features = ["catch-panic", "request-id", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
url = "2.5.7"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_must_use = "deny"
unknown_lints = "deny"
renamed_and_removed_lints = "deny"
unfulfilled_lint_expectations = "deny"
unexpected_cfgs = "deny"
unreachable_pub = "deny"
unnameable_types = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
let_underscore_lock = "deny"
let_underscore_drop = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
allow_attributes_without_reason = "deny"
mem_forget = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"
fallible_impl_from = "deny"
unchecked_time_subtraction = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
indexing_slicing = "deny"
match_wildcard_for_single_variants = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
must_use_candidate = "deny"
return_self_not_must_use = "deny"
exit = "deny"
print_stdout = "deny"
print_stderr = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
redundant_clone = "deny"
implicit_clone = "deny"
needless_collect = "deny"
needless_pass_by_ref_mut = "deny"
unnecessary_box_returns = "deny"
unused_self = "deny"
unused_async = "deny"
ref_option = "deny"
option_option = "deny"
match_same_arms = "deny"
map_unwrap_or = "deny"
significant_drop_in_scrutinee = "deny"
