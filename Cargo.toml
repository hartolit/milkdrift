[workspace]
resolver = "3"
members = [
    "adapters/local-process",
    "adapters/model-provider",
    "adapters/redb-store",
    "adapters/secret-env",
    "crates/authority",
    "crates/blueprint",
    "crates/capability",
    "crates/capability-host",
    "crates/contracts",
    "crates/model",
    "crates/persistence",
    "crates/runtime",
    "crates/workspace",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hartolit/milkdrift"
rust-version = "1.95"

[workspace.dependencies]
base64 = "0.22.1"
blake3 = "1.8.2"
milkdrift-contracts = { version = "=0.1.0", path = "crates/contracts" }
proptest = "1.7.0"
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tempfile = "3.21.0"
thiserror = "2.0.16"
tracing = "0.1.41"
url = "2.5.7"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
