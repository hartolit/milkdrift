[workspace]
resolver = "3"
members = [
    "adapters/local-process",
    "adapters/model-provider",
    "adapters/peer-http",
    "adapters/redb-store",
    "adapters/secret-env",
    "crates/authority",
    "crates/blueprint",
    "crates/capability",
    "crates/capability-host",
    "crates/contracts",
    "crates/control",
    "crates/control-client",
    "crates/control-protocol",
    "crates/model",
    "crates/persistence",
    "crates/peer-protocol",
    "crates/runtime",
    "crates/workspace",
    "apps/cli",
    "apps/daemon",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hartolit/milkdrift"
rust-version = "1.95"

[workspace.dependencies]
base64 = "0.22.1"
blake3 = "1.8.2"
axum = { version = "0.8.9", features = ["json", "tokio", "http1"] }
async-stream = "0.3.6"
clap = { version = "4.6.6", features = ["derive", "env"] }
futures-util = "0.3.31"
milkdrift-contracts = { version = "=0.1.0", path = "crates/contracts" }
proptest = "1.7.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
subtle = "2.6.1"
tempfile = "3.21.0"
thiserror = "2.0.16"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tower = { version = "0.5.2", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6.6", features = ["catch-panic", "request-id", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
url = "2.5.7"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
