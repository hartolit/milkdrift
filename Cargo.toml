[workspace]
resolver = "3"
members = [
    "adapters/redb-store",
    "crates/blueprint",
    "crates/capability",
    "crates/persistence",
    "crates/runtime",
    "crates/workspace",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hartolit/milkdrift"
rust-version = "1.95"

[workspace.dependencies]
blake3 = "1.8.2"
proptest = "1.7.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
tracing = "0.1.41"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
