[workspace]
members = [
    "tools/policy-tool",
    "benchmarks/observer",
    "crates/domain/f0",
    "crates/domain/f1-a",
    "crates/domain/f1-b",
    "crates/platform/platform",
    "crates/adapters/adapter",
    "crates/runtime/e0",
    "crates/runtime/capability",
    "crates/runtime/e1",
    "crates/apps/app",
]
exclude = ["vendor/*"]
resolver = "3"

[workspace.metadata.milkdrift]
policy-version = 1

[[workspace.metadata.milkdrift.exceptions]]
id = "external-policy-tool-reviewed-ext"
source = "policy-tool"
target = "reviewed-ext"
scope = "external"
kind = "normal"
rationale = "the fixture tooling dependency exercises exact external exception matching"

[patch.crates-io]
reviewed-ext = { path = "vendor/reviewed-ext" }
