[workspace]
members = [
    "crates/adapters/candle-backend",
    "crates/runtime/inference-runtime",
    "crates/runtime/application-runtime",
    "crates/apps/desktop-slint",
    "benchmarks/runtime",
]
exclude = ["vendor/*"]
resolver = "3"

[workspace.metadata.milkdrift]
policy-version = 1

[[workspace.metadata.milkdrift.exceptions]]
id = "external-candle-cudarc"
source = "candle-backend"
target = "cudarc"
scope = "external"
kind = "normal"
rationale = "the fixture models the exact reviewed optional cudarc contract"

[[workspace.metadata.milkdrift.exceptions]]
id = "cuda-application-to-candle"
source = "application-runtime"
target = "candle-backend"
scope = "cuda-forward"
kind = "normal"
rationale = "E1 forwards opt-in CUDA to the provider"

[[workspace.metadata.milkdrift.exceptions]]
id = "cuda-desktop-to-application"
source = "desktop-slint"
target = "application-runtime"
scope = "cuda-forward"
kind = "normal"
rationale = "the app forwards opt-in CUDA through E1"

[[workspace.metadata.milkdrift.exceptions]]
id = "local-inference-to-candle-dev"
source = "inference-runtime"
target = "candle-backend"
scope = "local"
kind = "development"
rationale = "E0 tests use the reviewed provider through a development-only dependency"

[[workspace.metadata.milkdrift.exceptions]]
id = "cuda-inference-to-candle-dev"
source = "inference-runtime"
target = "candle-backend"
scope = "cuda-forward"
kind = "development"
rationale = "E0 tests forward opt-in CUDA to the provider"

[[workspace.metadata.milkdrift.exceptions]]
id = "cuda-observer-to-application"
source = "runtime-benchmarks"
target = "application-runtime"
scope = "cuda-forward"
kind = "normal"
rationale = "the benchmark observer forwards opt-in CUDA through E1"

[patch.crates-io]
candle-core = { path = "vendor/candle-core" }
candle-nn = { path = "vendor/candle-nn" }
candle-transformers = { path = "vendor/candle-transformers" }
cudarc = { path = "vendor/cudarc" }
