[package]
name = "inference-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.milkdrift]
role = "runtime-foundation"
hardware-suites = [
    { profile = "cuda", target = "cuda_hardware", feature = "cuda-hardware-tests", runner = "harness-free" },
    { profile = "cuda", target = "fault_injection", feature = "cuda", runner = "serial-libtest" },
]

[features]
default = []
cuda = ["candle-backend/cuda"]
cuda-hardware-tests = ["cuda"]

[dev-dependencies]
candle-backend = { path = "../../adapters/candle-backend" }

[[test]]
name = "cuda_hardware"
path = "tests/cuda_hardware.rs"
harness = false
required-features = ["cuda-hardware-tests"]
