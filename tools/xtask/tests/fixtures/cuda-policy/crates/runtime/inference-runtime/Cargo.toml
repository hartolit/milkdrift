[package]
name = "inference-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.milkdrift]
role = "runtime-foundation"

[features]
default = []
cuda = ["candle-backend/cuda"]
cuda-hardware-tests = ["cuda"]

[dev-dependencies]
candle-backend = { path = "../../adapters/candle-backend" }

[[test]]
name = "cuda_hardware"
path = "tests/cuda_hardware.rs"
harness = false
required-features = ["cuda-hardware-tests"]
