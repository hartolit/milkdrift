[package]
name = "candle-backend"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.milkdrift]
role = "adapter"
responsibility = "Provide the fixture CUDA adapter"
cuda-provider = true
hardware-suites = [
    { profile = "cuda", target = "cuda_hardware", feature = "cuda-hardware-tests", runner = "harness-free" },
]

[features]
default = []
cuda = [
    "dep:cudarc",
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
]
cuda-hardware-tests = ["cuda"]

[dependencies]
candle-core = { version = "=0.11.0", default-features = false }
candle-nn = { version = "=0.11.0", default-features = false }
candle-transformers = { version = "=0.11.0", default-features = false }
cudarc = { version = "=0.19.8", default-features = false, features = ["std", "driver", "cuda-version-from-build-system", "dynamic-linking"], optional = true }

[[test]]
name = "cuda_hardware"
path = "tests/cuda_hardware.rs"
harness = false
required-features = ["cuda-hardware-tests"]
