[package]
name = "milkdrift-redb-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
test-admin = []

[dependencies]
blake3.workspace = true
milkdrift-authority = { version = "=0.1.0", path = "../../crates/authority" }
milkdrift-blueprint = { version = "=0.1.0", path = "../../crates/blueprint" }
milkdrift-capability = { version = "=0.1.0", path = "../../crates/capability" }
milkdrift-peer-protocol = { version = "=0.1.0", path = "../../crates/peer-protocol" }
milkdrift-persistence = { version = "=0.1.0", path = "../../crates/persistence" }
milkdrift-workspace = { version = "=0.1.0", path = "../../crates/workspace" }
redb = "=2.6.3"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
milkdrift-capability = { version = "=0.1.0", path = "../../crates/capability" }
tempfile = "3.21.0"

[[test]]
name = "application_state"
required-features = ["test-admin"]

[[test]]
name = "contracts"
required-features = ["test-admin"]

[[test]]
name = "open_faults"
required-features = ["test-admin"]

[lints]
workspace = true
