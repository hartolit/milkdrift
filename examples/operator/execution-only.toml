# Maintained operator configuration. See README.md in this directory.
schema_version = 13
role = "execution_only"
host_id = "host:execution"
data_root = "./data"
bind = "127.0.0.1:9734"
security_audit_record_bound = 10000

[secret_sources."credential:operator"]
type = "environment"
variable = "MILKDRIFT_TOKEN"

[[actors]]
credential_ref = "credential:operator"
actor = "human:operator"
grant_id = "grant:operator"
grant_revision = 1
revocation_generation = 0
preset = "controller"
enabled = true

[actors.authority]
valid_from = 0
valid_until = 4102444800000
# Explicit opt-in for the model's unknown effect class and uploaded artifact identities.
# Capability/operation allowlists, sensitivities and every resource budget remain finite.
dangerous_allow_broad_authority = true

[actors.authority.resources]
filesystem = []
secrets = []

[actors.authority.resources.workflow_run]
# Direct invocations have no workflow lineage to match.
type = "any"

[actors.authority.resources.capability]
type = "allow"
maximum_side_effect = "unknown"

[actors.authority.resources.capability.identities]
type = "only"
values = ["operator-process", "operator-model"]

[actors.authority.resources.capability.categories]
type = "any"

[actors.authority.resources.capability.operations]
type = "only"
values = ["process.execute", "model.generate"]

[actors.authority.resources.capability.provider_profiles]
type = "any"

[actors.authority.resources.capability.trust_zones]
type = "only"
values = ["local-process", "operator-configured-local-model"]

[actors.authority.resources.capability.execution_trust_classes]
type = "any"

[actors.authority.resources.capability.localities]
type = "any"

[actors.authority.resources.capability.peers]
type = "any"

[actors.authority.resources.network]
profiles = []
destinations = []

[actors.authority.resources.artifacts]
type = "allow"
identities = { type = "any" }
# Uploads default to restricted, and process/model outputs retain that classification.
sensitivities = ["public", "internal", "restricted"]

[actors.authority.resources.layouts]
type = "deny_all"

[actors.authority.resources.peers]
identities = []
allow_any = false

[actors.authority.resources.daemon]
readiness = true
detailed_health = true
own_authority = true
configuration = false
audit = false

[actors.authority.resources.workspace]
scopes = ["root"]
allow_any_in_run = false

[actors.authority.budget]
cost_minor = 1000
duration_ms = 300000
invocations = 1000
artifact_bytes = 67108864
units = 4000000
concurrency = 4

[runtime]
request_queue = 128
maintenance_interval_ms = 100
maximum_tick_items = 128
global_concurrency = 32
per_run_concurrency = 8
per_branch_concurrency = 4
per_capability_concurrency = 8
effect_threads = 4
effect_queue = 64
cancellation_queue = 32
maximum_effect_claim = 32
lease_duration_ms = 30000

[adapters]
process_profiles = []
model_profiles = []

[peers]
mode = "disabled"

[shutdown]
deadline_ms = 10000
effect_policy = "drain"

[application_receipts]
hot_receipt_bound = 10000
archive_batch_size = 256

# Per-call ceilings are also constrained by the actor grant and prepared adapter bounds.
[serving]
worker_threads = 4
maximum_global_active = 256
maximum_dispatch_queue = 256
maximum_hot_terminal_records = 10000
archive_batch_size = 256
observation_hot_retention_ms = 86400000
recovery_page = 128
poll_interval_ms = 100

[serving.clients]
maximum_uploaded_artifacts = 1024
maximum_uploaded_bytes = 67108864
maximum_concurrent = 4
maximum_requests_per_minute = 600
catalog_ttl_ms = 30000

[serving.clients.execution_limits]
artifact_bytes = 67108864
duration_ms = 300000
cost_micros = 0
input_units = 1000000
output_units = 1000000
observations = 4096
