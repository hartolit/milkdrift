# Maintained operator configuration. See README.md in this directory.
schema_version = 14
role = "workflow_enabled"
host_id = "host:local"
data_root = "./data"
bind = "127.0.0.1:9734"
security_audit_record_bound = 10000

[secret_sources."credential:operator"]
type = "environment"
variable = "MILKDRIFT_TOKEN"

[[actors]]
credential_ref = "credential:operator"
actor = "human:operator"
grant_id = "grant:operator"
grant_revision = 1
revocation_generation = 0
preset = "controller"
enabled = true

[actors.authority]
valid_from = 0
valid_until = 4102444800000
dangerous_allow_broad_authority = true

[actors.authority.resources]
filesystem = []
secrets = []

[actors.authority.resources.workflow_run]
type = "any"

[actors.authority.resources.capability]
type = "allow"
maximum_side_effect = "read_only"

[actors.authority.resources.capability.identities]
type = "only"
values = ["operator-process"]

[actors.authority.resources.capability.categories]
type = "any"

[actors.authority.resources.capability.operations]
type = "only"
values = ["process.execute"]

[actors.authority.resources.capability.provider_profiles]
type = "any"

[actors.authority.resources.capability.trust_zones]
type = "only"
values = ["local-process"]

[actors.authority.resources.capability.execution_trust_classes]
type = "any"

[actors.authority.resources.capability.localities]
type = "any"

[actors.authority.resources.capability.peers]
type = "any"

[actors.authority.resources.network]
profiles = []
destinations = []

[actors.authority.resources.artifacts]
type = "allow"
identities = { type = "any" }
sensitivities = ["public", "internal", "restricted"]

[actors.authority.resources.peers]
identities = []
allow_any = false

[actors.authority.resources.daemon]
readiness = true
detailed_health = true
own_authority = true
configuration = false
audit = false

[actors.authority.resources.workspace]
scopes = ["root"]
allow_any_in_run = false

[actors.authority.budget]
cost_minor = 1000
duration_ms = 300000
invocations = 1000
artifact_bytes = 67108864
units = 4000000
concurrency = 4

[runtime]
request_queue = 128
maintenance_interval_ms = 100
global_concurrency = 32
effect_threads = 4
effect_queue = 64
cancellation_queue = 32
maximum_effect_claim = 32
lease_duration_ms = 30000

[adapters]
process_profiles = []
model_profiles = []

[peers]
mode = "disabled"

[shutdown]
deadline_ms = 10000
effect_policy = "drain"


[serving]
browser_origins = ["http://127.0.0.1:5173", "http://127.0.0.1:4173"]
worker_threads = 4
maximum_global_active = 256
maximum_dispatch_queue = 256
maximum_hot_terminal_records = 10000
archive_batch_size = 256
observation_hot_retention_ms = 86400000
recovery_page = 128
poll_interval_ms = 100
